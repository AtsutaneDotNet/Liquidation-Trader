<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Liquidation Trader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="card login-card form-container">
            <h1 class="logo">Liquidation <span class="highlight">Trader</span></h1>
            
            <form id="login-form" method="POST">
                <div class="form-group row">
                    <div class="col" style="flex: 1;">
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Username">
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col" style="flex: 1;">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">Login</button>
                <div id="login-error" class="login-error">Invalid credentials</div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
